seed: 3407
data:
  root: ../data/XRF55_Dataset_split
  train_batch_size: 512
  test_batch_size: 512
  num_workers: 4
  val_split: 0.0
  modality_keep_probs:
  - 0.5
  - 0.9
  - 0.6
linear_probe:
  epochs: 100
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  eval_every: 1
  head_type: linear
finetune:
  epochs: 100
  head_lr: 0.0001
  backbone_lr: 0.0001
  weight_decay: 0.01
  warmup_epochs: 0
  eval_every: 1
  schedule: none
eval:
  save_json: auto
  selection_metric: acc_all
_variant: "mirror of the A recipe (utils.har_train): AdamW lr 1e-4 CONSTANT, wd 0.01\
  \ (pytorch default), no scheduler, no val holdout (full 15400, last-model) \u2014\
  \ isolates the JEPA initialization vs self-trained A_xfi_original_b512."
