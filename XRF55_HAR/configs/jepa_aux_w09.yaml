seed: 3407
data:
  root: ../data/XRF55_Dataset_split
  batch_size: 512
  num_workers: 4
  val_split: 0.05
  pin_memory: false
  prefetch_factor: 2
model:
  model_depth: 5
  num_classes: 55
  backbone_root: ./backbone_models
  predictor:
    depth: 4
    num_heads: 8
    ffn_dim: 2048
    dropout: 0.0
optim:
  lr: 0.0005
  weight_decay: 0.05
  warmup_epochs: 5
  epochs: 100
ema:
  base_momentum: 0.996
bn_warmup_batches: 50
mask:
  modality_keep_probs:
  - 0.5
  - 0.9
  - 0.5
  token_mask_rate: 0.25
log:
  save_dir: ./jepa_checkpoints
  save_every_epochs: 10
  log_masks_first_epoch: true
aux_loss:
  weight: 0.5
  ramp_epochs: 5
  normalize: both
_variant: "R3.4 ablation: aux loss (lambda 0.5) with the ORIGINAL WiFi keep 0.9 \u2014\
  \ separates the contributions of the aux loss vs the WiFi-0.7 mask table (compare\
  \ against pretrain_aux_w07 and the 20260918 baseline run)."
