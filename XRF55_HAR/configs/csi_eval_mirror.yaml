seed: 3407
data:
  root: ../data/XRF55_Dataset_split
  train_batch_size: 512
  test_batch_size: 512
  num_workers: 4
  val_split: 0.0
model:
  # fallback arch (scratch path); probe/finetune take the checkpoint-embedded config
  channels: 270
  time_steps: 1000
  patch_c: 30
  patch_t: 100
  dim: 256
  depth: 8
  num_heads: 4
  ffn_dim: 1024
  input_norm: none
linear_probe:
  epochs: 100
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  eval_every: 1
finetune:
  epochs: 100
  head_lr: 0.0001
  backbone_lr: 0.0001
  weight_decay: 0.01
  warmup_epochs: 0
  eval_every: 1
  schedule: none
eval:
  save_json: auto
  selection_metric: acc_wifi
_variant: "csi_jepa downstream MIRROR (the winning finetune recipe, D28/D29): constant\
  \ lr 1e-4 (head AND encoder), wd 0.01, no scheduler, NO val holdout (full 15400,\
  \ last-model) -- for csi_finetune and csi_scratch. Isolates JEPA init (G1) and\
  \ tokenizer-vs-extractor (G2) under a steps-matched protocol."
