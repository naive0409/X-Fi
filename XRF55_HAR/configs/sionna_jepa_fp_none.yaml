seed: 3407
data:
  corpus: sionna
  cache_root: ../sionna_dataset/cache
  tensors_root: ../sionna_dataset/tensors
  batch_size: 512
  num_workers: 4
  val_split: 0.05
  split: interp
  pin_memory: false
  prefetch_factor: 2
model:
  dim: 256
  depth: 8
  num_heads: 4
  ffn_dim: 1024
  dropout: 0.0
  scene_mode: none      # CSI-only 对照（B3）
  canvas: global
  raster_patch: 20
  csi_repr: reim
  input_norm: channel_std
  predictor:
    depth: 4
    num_heads: 4
    ffn_dim: 512
    dropout: 0.0
optim:
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  epochs: 100
ema:
  base_momentum: 0.996
mask:
  token_mask_rate: 0.5
  rect_c: 1
  rect_t: 2
  link_dropout_prob: 0.3
  scene_token_dropout: 0.0
p1:
  weight: 0.0           # CSI-only 无 P1
  ramp_epochs: 5
log:
  save_dir: ./dloc_checkpoints
  save_every_epochs: 25
  log_masks_first_epoch: true
_variant: "Phase C: sionna corpus, CSI-only control arm (scene_mode=none).\
  Everything else key-by-key identical to sionna_jepa_fp.yaml."
