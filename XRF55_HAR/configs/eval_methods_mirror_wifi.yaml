seed: 3407
data:
  root: ../data/XRF55_Dataset_split
  train_batch_size: 512
  test_batch_size: 512
  num_workers: 4
  val_split: 0.0
  modality_keep_probs:
  - 0.0
  - 1.0
  - 0.0
linear_probe:
  epochs: 100
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  eval_every: 1
  head_type: linear
finetune:
  epochs: 100
  head_lr: 0.0001
  backbone_lr: 0.0001
  weight_decay: 0.01
  warmup_epochs: 0
  eval_every: 1
  schedule: none
eval:
  save_json: auto
  selection_metric: acc_all
_variant: "Phase A0 downstream: mirror-of-A' recipe on WiFi-ONLY batches (keep probs\
  \ [0.0,1.0,0.0]). READ THE WiFi ROW of the 7-subset table; mmWave/RFID-containing\
  \ rows are out-of-distribution for a WiFi-only finetuned model and macro_avg/worst_subset\
  \ are NOT meaningful for A0. G2 control for csi_jepa (A1)."
