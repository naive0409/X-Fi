seed: 3407
data:
  corpus: sionna        # SionnaCorpus（csi_jepa/sionna_data.py；接入 diff 见 SIONNA_PIPELINE.md §9）
  cache_root: ../sionna_dataset/cache      # sionna_gen 产物（仓库根下生成）
  tensors_root: ../sionna_dataset/tensors  # PNG 派生张量（SionnaRasterProvider 加载）
  batch_size: 512
  num_workers: 4
  val_split: 0.05       # SSL 诊断 val：逐场景 train 尾部 5%
  split: interp         # interp（逐场景 UE 随机 90/10）| holdout_scenes（跨场景零样本轴）
  pin_memory: false
  prefetch_factor: 2
model:
  dim: 256
  depth: 8
  num_heads: 4
  ffn_dim: 1024
  dropout: 0.0
  scene_mode: raster    # raster（主）| none（CSI-only 对照，configs/sionna_jepa_fp_none.yaml）
  canvas: global        # 张量已按 64x29m 全局画布生成（与 DLoc 同框）
  raster_patch: 20      # 4m = 20 格元（cell 0.2m）
  csi_repr: reim        # reim（32 行）
  input_norm: channel_std
  predictor:
    depth: 4
    num_heads: 4
    ffn_dim: 512
    dropout: 0.0
optim:
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  epochs: 100
ema:
  base_momentum: 0.996
mask:
  token_mask_rate: 0.5
  rect_c: 1
  rect_t: 2
  link_dropout_prob: 0.3
  scene_token_dropout: 0.0
p1:
  weight: 0.3
  ramp_epochs: 5
log:
  save_dir: ./dloc_checkpoints
  save_every_epochs: 25
  log_masks_first_epoch: true
_variant: "Phase C (SIONNA_PIPELINE.md): Sionna-synthetic multi-scene CSI-JEPA.\
  Same recipe as dloc_jepa_fp.yaml; data swapped to the Sionna-generated corpus\
  (MUSE-FM scene recipe + moderate extension, WiFi 2.4GHz / 234 SC ~40MHz).\
  Scene count is dynamic (hundreds~2600); split by scene."
