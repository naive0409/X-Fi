seed: 3407
data:
  root: ../data/XRF55_Dataset_split
  train_batch_size: 512
  test_batch_size: 512
  num_workers: 4
  val_split: 0.05
model:
  # fallback arch (scratch path); probe/finetune take the checkpoint-embedded config
  channels: 270
  time_steps: 1000
  patch_c: 30
  patch_t: 100
  dim: 256
  depth: 8
  num_heads: 4
  ffn_dim: 1024
  input_norm: none
linear_probe:
  epochs: 100
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  eval_every: 1
finetune:
  epochs: 100
  head_lr: 0.0001
  backbone_lr: 0.0001
  weight_decay: 0.01
  warmup_epochs: 0
  eval_every: 1
  schedule: none
eval:
  save_json: auto
  selection_metric: acc_wifi
_variant: "csi_jepa downstream PROBE: frozen encoder + fresh classification_Head(256,55),\
  \ 100ep lr 1e-3 wd 0.05 warmup 5 + cosine, val 5% (train split only) for best-by-val."
