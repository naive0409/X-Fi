seed: 3407
data:
  cache_root: ../data/dloc_cache
  batch_size: 512
  num_workers: 4
  val_split: 0.05       # SSL 诊断 val：逐场景 train 块尾部 5%（连续块）
  split: building       # S-BUILDING：训 jacobs(5场景90%块)、测 atkinson(3场景全量)——跨楼型
  pin_memory: false
  prefetch_factor: 2
model:
  dim: 256
  depth: 8
  num_heads: 4
  ffn_dim: 1024
  dropout: 0.0
  scene_mode: raster    # raster | shuffled | onehot | none（对照组各一 config/覆盖）
  canvas: global        # global 64x29m（规范同框）| content 40x20m（空白 token 代价消融）
  raster_patch: 20      # 4m = 20 格元（cell 0.2m）
  csi_repr: reim        # reim（32 行）| mag（16 行，单键消融）
  input_norm: channel_std
  predictor:
    depth: 4
    num_heads: 4
    ffn_dim: 512
    dropout: 0.0
optim:
  lr: 0.001
  weight_decay: 0.05
  warmup_epochs: 5
  epochs: 100
ema:
  base_momentum: 0.996
mask:
  token_mask_rate: 0.5
  rect_c: 1             # 一 AP x 2 频带的矩形块（快照数据：无时间轴，rect_t=子载波频带）
  rect_t: 2
  link_dropout_prob: 0.3  # 整 AP 行掩（WiFi-JEPA link-mask 对应物）
  scene_token_dropout: 0.0
p1:
  weight: 0.3
  ramp_epochs: 5
log:
  save_dir: ./dloc_checkpoints
  save_every_epochs: 25
  log_masks_first_epoch: true
_variant: "Phase B-v2 BUILDING pretrain (raster): identical to dloc_jepa_fp.yaml except data.split=building — SSL corpus = jacobs 5 scenarios (90% blocks, ~46K); test = atkinson 3 scenarios (56,395) zero-overlap. 4AP->3AP via zero-pad. Cross-building style axis per D52 route (b).
"
